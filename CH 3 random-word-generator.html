<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Word Generator</title>
<style>
  :root{
    --bg:#f7f5f2; --card:#ffffff; --text:#1f2933; --accent:#3f6f5f; --muted:#7b8794;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1f22; --card:#252b2f; --text:#eceff1; --accent:#7fbfa5; --muted:#9aa5ab;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1f22; --card:#252b2f; --text:#eceff1; --accent:#7fbfa5; --muted:#9aa5ab;
  }
  html,body{
    height:100%; margin:0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:2.5rem 2rem;
    max-width:420px;
    width:90%;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
  }
  h1{ font-size:1.1rem; color:var(--muted); font-weight:600; margin:0 0 1.5rem; letter-spacing:0.02em; text-transform:uppercase;}
  #word{
    font-size:2.4rem;
    font-weight:700;
    min-height:3rem;
    margin:0 0 2rem;
    color:var(--accent);
    word-break:break-word;
  }
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:0.9rem 2rem;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.1s ease, opacity 0.2s ease;
  }
  button:active{ transform:scale(0.96); }
  .count{ margin-top:1rem; font-size:0.8rem; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Random Word</h1>
    <div id="word">Click to start</div>
    <button onclick="pick()">Generate</button>
    <div class="count" id="count"></div>
  </div>

<script>
const words = ["assess","community","computer","construction","contact","contract","design","distribution","element","evaluate","final","institutional","labor","maintenance","obtain","orientation","perceive","policy","positive","primary","purchase","regulation","reside","restrict","security","select","site","strategy","survey","transfer","utility"];
let seen = 0;
function pick(){
  const w = words[Math.floor(Math.random()*words.length)];
  document.getElementById('word').textContent = w;
  seen++;
  document.getElementById('count').textContent = seen + " word" + (seen===1?"":"s") + " generated";
}
</script>
</body>
</html>
